<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300" role="img" aria-label="Semantic retrieval: resume chunks embedded into vectors and ranked by cosine similarity">
  <defs>
    <pattern id="grid" width="29" height="29" patternUnits="userSpaceOnUse">
      <path d="M29 0H0v29" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00b8cc"/>
    </marker>
  </defs>

  <rect width="580" height="300" fill="#0d1117"/>
  <rect width="580" height="300" fill="url(#grid)"/>

  <text x="28" y="34" font-family="'Courier New', monospace" font-size="17" fill="#00b8cc" letter-spacing="1.2">// cosine_similarity</text>

  <!-- document with three chunk bands highlighted -->
  <rect x="28" y="56" width="124" height="208" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="42" y="72"  width="72" height="5" fill="#30363d"/>
  <rect x="42" y="86"  width="94" height="5" fill="#30363d"/>
  <rect x="42" y="106" width="96" height="16" fill="#00e5ff" opacity="0.22"/>
  <rect x="42" y="111" width="88" height="5" fill="#00e5ff"/>
  <rect x="42" y="136" width="84" height="5" fill="#30363d"/>
  <rect x="42" y="156" width="96" height="16" fill="#00e5ff" opacity="0.22"/>
  <rect x="42" y="161" width="76" height="5" fill="#00e5ff"/>
  <rect x="42" y="186" width="92" height="5" fill="#30363d"/>
  <rect x="42" y="200" width="66" height="5" fill="#30363d"/>
  <rect x="42" y="220" width="96" height="16" fill="#00e5ff" opacity="0.22"/>
  <rect x="42" y="225" width="84" height="5" fill="#00e5ff"/>
  <rect x="42" y="248" width="58" height="5" fill="#30363d"/>

  <!-- embed arrow -->
  <line x1="162" y1="160" x2="228" y2="160" stroke="#00b8cc" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="195" y="150" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#6e7681">embed</text>

  <!-- ranked retrieval results -->
  <g font-family="'Courier New', monospace" font-size="15">
    <rect x="242" y="78" width="310" height="52" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="256" y="100" fill="#c9d1d9">[0.021, -0.152, 0.084, ...]</text>
    <rect x="256" y="110" width="220" height="7" fill="#21262d"/>
    <rect x="256" y="110" width="196" height="7" fill="#3fb950"/>
    <text x="492" y="117" fill="#56d364">0.89</text>

    <rect x="242" y="144" width="310" height="52" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="256" y="166" fill="#c9d1d9">[0.118, 0.043, -0.067, ...]</text>
    <rect x="256" y="176" width="220" height="7" fill="#21262d"/>
    <rect x="256" y="176" width="158" height="7" fill="#00e5ff"/>
    <text x="492" y="183" fill="#00e5ff">0.72</text>

    <rect x="242" y="210" width="310" height="52" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="256" y="232" fill="#6e7681">[-0.074, 0.209, 0.011, ...]</text>
    <rect x="256" y="242" width="220" height="7" fill="#21262d"/>
    <rect x="256" y="242" width="90" height="7" fill="#6e7681"/>
    <text x="492" y="249" fill="#6e7681">0.41</text>
  </g>
</svg>
