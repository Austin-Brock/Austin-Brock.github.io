<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300" role="img" aria-label="CrewOpt: a crew schedule board where a first officer calls in sick, their flights are reassigned to a reserve, and the repaired schedule keeps 0 rule violations at 20–31% lower cost than a greedy baseline">
  <defs>
    <pattern id="cogrid" width="29" height="29" patternUnits="userSpaceOnUse">
      <path d="M29 0H0v29" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <marker id="coarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00b8cc"/>
    </marker>
  </defs>

  <rect width="580" height="300" fill="#0d1117"/>
  <rect width="580" height="300" fill="url(#cogrid)"/>

  <text x="28" y="34" font-family="'Courier New', monospace" font-size="17" fill="#00b8cc" letter-spacing="1.2">// recover_schedule</text>

  <g font-family="'Courier New', monospace">
    <!-- time axis -->
    <g font-size="11" fill="#6e7681" text-anchor="middle">
      <text x="125" y="62">06</text>
      <text x="213" y="62">09</text>
      <text x="301" y="62">12</text>
      <text x="389" y="62">15</text>
      <text x="477" y="62">18</text>
    </g>

    <!-- crew labels -->
    <g font-size="13" fill="#c9d1d9">
      <text x="28" y="92">CA 101</text>
      <text x="28" y="132" fill="#6e7681">FO 214</text>
      <text x="28" y="172">FA 330</text>
      <text x="28" y="212">FO 507</text>
    </g>
    <line x1="26" y1="128" x2="80" y2="128" stroke="#f85149" stroke-width="1.5"/>
    <text x="28" y="146" font-size="10" fill="#f85149">sick</text>
    <text x="28" y="226" font-size="10" fill="#6e7681">reserve</text>

    <!-- CA 101 -->
    <g font-size="11" fill="#c9d1d9" text-anchor="middle">
      <rect x="125" y="76" width="56" height="22" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="153" y="91">1201</text>
      <rect x="198" y="76" width="56" height="22" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="226" y="91">1342</text>
      <rect x="315" y="76" width="64" height="22" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="347" y="91">1588</text>
    </g>

    <!-- FO 214 (sick, dropped) -->
    <g font-size="11" fill="#f85149" text-anchor="middle">
      <rect x="125" y="116" width="56" height="22" fill="#0d1117" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="153" y="131">1201</text>
      <rect x="198" y="116" width="56" height="22" fill="#0d1117" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="226" y="131">1342</text>
    </g>

    <!-- FA 330 -->
    <g font-size="11" fill="#c9d1d9" text-anchor="middle">
      <rect x="125" y="156" width="56" height="22" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="153" y="171">1201</text>
      <rect x="198" y="156" width="56" height="22" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="226" y="171">1342</text>
      <rect x="403" y="156" width="72" height="22" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="439" y="171">1770</text>
    </g>

    <!-- FO 507 (reserve, picks up) -->
    <g font-size="11" fill="#00b8cc" text-anchor="middle">
      <rect x="125" y="196" width="56" height="22" fill="#161b22" stroke="#00b8cc" stroke-width="1.5"/>
      <text x="153" y="211">1201</text>
      <rect x="198" y="196" width="56" height="22" fill="#161b22" stroke="#00b8cc" stroke-width="1.5"/>
      <text x="226" y="211">1342</text>
    </g>
    <text x="552" y="211" font-size="13" fill="#00b8cc" text-anchor="end">REASSIGNED</text>

    <!-- stats -->
    <rect x="28" y="244" width="160" height="38" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="40" y="268" font-size="13" fill="#6e7681">cost</text>
    <text x="176" y="268" font-size="15" fill="#56d364" text-anchor="end">-20–31%</text>

    <rect x="210" y="244" width="160" height="38" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="222" y="268" font-size="13" fill="#6e7681">violations</text>
    <text x="358" y="268" font-size="15" fill="#56d364" text-anchor="end">0</text>

    <rect x="392" y="244" width="160" height="38" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="404" y="268" font-size="13" fill="#6e7681">kept</text>
    <text x="540" y="268" font-size="15" fill="#56d364" text-anchor="end">≥97.9%</text>
  </g>

  <path d="M266 127 L290 127 L290 207 L266 207" fill="none" stroke="#00b8cc" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#coarrow)"/>
</svg>
