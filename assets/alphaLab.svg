<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300" role="img" aria-label="AlphaLab: an AI's trade proposals pass through a risk engine, which fills one order and rejects two for breaking the concentration and no-short-selling rules, on a $1,000,000 simulated portfolio">
  <defs>
    <pattern id="algrid" width="29" height="29" patternUnits="userSpaceOnUse">
      <path d="M29 0H0v29" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <marker id="alarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00b8cc"/>
    </marker>
  </defs>

  <rect width="580" height="300" fill="#0d1117"/>
  <rect width="580" height="300" fill="url(#algrid)"/>

  <text x="28" y="34" font-family="'Courier New', monospace" font-size="17" fill="#00b8cc" letter-spacing="1.2">// daily_ai_run</text>

  <g font-family="'Courier New', monospace">
    <!-- pipeline -->
    <g font-size="12" text-anchor="middle">
      <rect x="28" y="54" width="112" height="30" fill="#161b22" stroke="#00b8cc" stroke-width="1.5"/>
      <text x="84" y="73" fill="#00b8cc">ai.propose</text>
      <rect x="168" y="54" width="112" height="30" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="224" y="73" fill="#c9d1d9">risk_engine</text>
      <rect x="308" y="54" width="112" height="30" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="364" y="73" fill="#c9d1d9">execution</text>
      <rect x="448" y="54" width="104" height="30" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="500" y="73" fill="#c9d1d9">ledger</text>
    </g>
    <g stroke="#00b8cc" stroke-width="1.5" marker-end="url(#alarrow)">
      <line x1="141" y1="69" x2="166" y2="69"/>
      <line x1="281" y1="69" x2="306" y2="69"/>
      <line x1="421" y1="69" x2="446" y2="69"/>
    </g>

    <!-- proposals -->
    <g font-size="13">
      <rect x="28" y="104" width="524" height="30" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
      <text x="40" y="124" fill="#c9d1d9">BUY  MSFT   120</text>
      <text x="540" y="124" fill="#56d364" text-anchor="end">✓ filled</text>

      <rect x="28" y="142" width="524" height="30" fill="#0d1117" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="40" y="162" fill="#c9d1d9">BUY  NVDA   900</text>
      <text x="540" y="162" fill="#f85149" text-anchor="end">✗ position &gt; 10%</text>

      <rect x="28" y="180" width="524" height="30" fill="#0d1117" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="40" y="200" fill="#c9d1d9">SELL TSLA    50</text>
      <text x="540" y="200" fill="#f85149" text-anchor="end">✗ no short selling</text>
    </g>
    <text x="28" y="230" font-size="11" fill="#6e7681">rejected, never resized · every check stored with the order</text>

    <!-- stats -->
    <rect x="28" y="244" width="160" height="38" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="40" y="268" font-size="13" fill="#6e7681">cash</text>
    <text x="176" y="268" font-size="15" fill="#56d364" text-anchor="end">$1M sim</text>

    <rect x="210" y="244" width="160" height="38" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="222" y="268" font-size="13" fill="#6e7681">checks</text>
    <text x="358" y="268" font-size="15" fill="#56d364" text-anchor="end">7</text>

    <rect x="392" y="244" width="160" height="38" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="404" y="268" font-size="13" fill="#6e7681">ideas/run</text>
    <text x="540" y="268" font-size="15" fill="#56d364" text-anchor="end">≤5</text>
  </g>
</svg>
