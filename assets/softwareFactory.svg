<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300" role="img" aria-label="Software Factory: a Linear ticket labeled factory:plan goes to a planner agent on Bedrock AgentCore, which reads the target repo and posts a plan back; a builder agent then implements the plan and opens a pull request">
  <defs>
    <pattern id="sfgrid" width="29" height="29" patternUnits="userSpaceOnUse">
      <path d="M29 0H0v29" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <marker id="sfarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#00b8cc"/>
    </marker>
  </defs>

  <rect width="580" height="300" fill="#0d1117"/>
  <rect width="580" height="300" fill="url(#sfgrid)"/>

  <text x="28" y="34" font-family="'Courier New', monospace" font-size="17" fill="#00b8cc" letter-spacing="1.2">// ticket_to_pr</text>

  <g font-family="'Courier New', monospace">
    <!-- linear ticket -->
    <rect x="28" y="62" width="150" height="86" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="42" y="84" font-size="13" fill="#6e7681">linear</text>
    <text x="42" y="108" font-size="15" fill="#c9d1d9">ENG-42</text>
    <rect x="42" y="120" width="120" height="20" fill="#0d1117" stroke="#00b8cc" stroke-width="1"/>
    <text x="102" y="134" font-size="12" fill="#00b8cc" text-anchor="middle">factory:plan</text>

    <!-- planner -->
    <rect x="222" y="62" width="160" height="140" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="302" y="84" font-size="13" fill="#6e7681" text-anchor="middle">agentcore</text>
    <text x="302" y="108" font-size="16" fill="#c9d1d9" text-anchor="middle">planner</text>
    <g font-size="13" fill="#6e7681">
      <text x="238" y="138">list_files</text>
      <text x="238" y="160">read_file</text>
      <text x="238" y="182">search</text>
    </g>
    <text x="366" y="194" font-size="11" fill="#6e7681" text-anchor="end">read-only</text>

    <!-- plan comment -->
    <rect x="426" y="62" width="126" height="86" fill="#161b22" stroke="#56d364" stroke-width="1.5"/>
    <text x="440" y="84" font-size="13" fill="#6e7681">comment</text>
    <text x="440" y="108" font-size="15" fill="#c9d1d9">plan.md</text>
    <text x="538" y="136" font-size="15" fill="#56d364" text-anchor="end">POSTED</text>

    <!-- builder -->
    <rect x="222" y="232" width="160" height="44" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="302" y="259" font-size="15" fill="#c9d1d9" text-anchor="middle">builder</text>

    <rect x="426" y="232" width="126" height="44" fill="#161b22" stroke="#56d364" stroke-width="1.5"/>
    <text x="440" y="259" font-size="15" fill="#c9d1d9">PR</text>
    <text x="538" y="259" font-size="15" fill="#56d364" text-anchor="end">OPENED</text>
  </g>

  <line x1="178" y1="105" x2="214" y2="105" stroke="#00b8cc" stroke-width="1.8" marker-end="url(#sfarrow)"/>
  <line x1="382" y1="105" x2="418" y2="105" stroke="#00b8cc" stroke-width="1.8" marker-end="url(#sfarrow)"/>
  <path d="M489 148 L489 217 L302 217 L302 226" fill="none" stroke="#00b8cc" stroke-width="1.8" marker-end="url(#sfarrow)"/>
  <line x1="382" y1="254" x2="418" y2="254" stroke="#00b8cc" stroke-width="1.8" marker-end="url(#sfarrow)"/>
</svg>
